name: triate
description: "Triate."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  url_launcher: ^6.1.14

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # - assets/documento.json
    - assets/banner.png

  fonts:
    - family: TypoRound
      fonts:
        - asset: assets/fonts/Typo_Round_Regular.otf
        - asset: assets/fonts/Typo_Round_Bold.otf
          weight: 700

    - family: VarelaRound
      fonts:
        - asset: assets/fonts/VarelaRound-Regular.ttf
